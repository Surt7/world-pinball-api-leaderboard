events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    client_max_body_size 50M;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    large_client_header_buffers 4 32k;

    # SSL global settings
    ssl_certificate /etc/nginx/certs/worldpinball.local.crt;
    ssl_certificate_key /etc/nginx/certs/worldpinball.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # WebSocket connection upgrade mapping for SignalR and Angular HMR
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker internal DNS resolver (auto-detects container IP changes)
    resolver 127.0.0.11 ipv6=off valid=5s;

    # -------------------------------------------------------------------------
    # Upstreams targeting local host development services (Kestrel / Angular)
    # -------------------------------------------------------------------------
    upstream bff_upstream {
        server bff:8080;
        server host.docker.internal:5285 backup;
        keepalive 32;
    }

    upstream api_upstream {
        least_conn;
        server api:8443;
        server host.docker.internal:8443 backup;
        keepalive 32;
    }

     # Upstream targeting dedicated HTTP/2 gRPC port on Core API
     upstream api_grpc_upstream {
         least_conn;
         server api:8443;
         server host.docker.internal:8443 backup;
         keepalive 32;
     }
    
    upstream auth_upstream {
        server keycloak:8080;             # Keycloak internal container
        server host.docker.internal:8081 backup; # Keycloak exposed on host port
        keepalive 32;
    }

    upstream frontend_upstream {
        server host.docker.internal:4200;
        server host.docker.internal:4200 backup; # Fallback to local ng serve if running
        keepalive 32;
    }

    # Common reverse proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    # -------------------------------------------------------------------------
    # HTTP -> HTTPS redirect for all *.worldpinball.local domains
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name worldpinball.local *.worldpinball.local;
        return 301 https://$host$request_uri;
    }

    # 1. AUTH DOMAIN: auth.worldpinball.local (Keycloak IAM)
    server {
        listen 443 ssl;
        server_name auth.worldpinball.local;

        location / {
            proxy_pass http://auth_upstream;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # 2. CORE API DOMAIN: api.worldpinball.local (Backend Core API)
    server {
        listen 443 ssl;
        http2 on; # Activate HTTP/2 
        server_name api.worldpinball.local;

   # Ask clients for certificate if they have one (mTLS for pinball machines)
        ssl_verify_client optional_no_ca;
        
        location /worldpinball.gamesessions.v1.GameSessionService/ {
             grpc_pass grpcs://api_grpc_upstream;
             grpc_ssl_server_name on;
             grpc_ssl_name api.worldpinball.local;
             grpc_ssl_trusted_certificate /etc/nginx/certs/dev-rootCA.pem;
             grpc_ssl_verify on;
        
           grpc_set_header Host $host;
             grpc_set_header X-Forwarded-Proto https;
             grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             grpc_read_timeout 3600s;
             grpc_send_timeout 3600s;
        }

               # REST, Swagger, and Healthchecks over encrypted TLS (Zero-Trust)
               location / {
                   proxy_pass https://api_upstream;
                   proxy_ssl_server_name on;
                   proxy_ssl_name api.worldpinball.local;
                   proxy_ssl_trusted_certificate /etc/nginx/certs/dev-rootCA.pem;
                   proxy_ssl_verify on;
                   
                   # Common proxy headers
                   proxy_set_header Host $host;
                   proxy_set_header X-Real-IP $remote_addr;
                   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                   proxy_set_header X-Forwarded-Proto https;
                   proxy_set_header X-Forwarded-Host $host;
                   proxy_set_header X-Forwarded-Port 443;
                   proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
                   
                   # Keepalive fix: clears the Connection header for HTTP/1.1 reuse
                   proxy_set_header Connection "";
                   
                   # Auto-retry on stale connections
                   proxy_next_upstream error timeout invalid_header http_502 http_503;
               }
    }

    # 3. BFF DOMAIN: bff.worldpinball.local (Gateway & SignalR Hubs)
    server {
        listen 443 ssl;
        server_name bff.worldpinball.local;

        # SignalR WebSockets (Lobby / Telemetry Hubs)
        location /hubs/ {
            proxy_pass http://bff_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://bff_upstream;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

   
    # 4. UNIFIED DOMAIN : worldpinball.local (Angular + BFF)
    server {
        listen 443 ssl;
        server_name worldpinball.local;
        # API et Authentification BFF
        location ~ ^/(api|signin-oidc|signout-callback-oidc) {
            proxy_pass http://bff_upstream;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
        # SignalR Hubs
        location /hubs/ {
            proxy_pass http://bff_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
        }
        # Frontend Angular (ton serveur ng serve ou conteneur)
        location / {
            proxy_pass https://host.docker.internal:4200;
            proxy_ssl_verify off;
            proxy_set_header Cookie ""; # Strip cookies for static assets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
