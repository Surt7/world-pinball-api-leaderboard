events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # 1. SECURITY HARDENING (Firewall & Anti-Fingerprinting)
    # -------------------------------------------------------------------------
    server_tokens off;                      # Hide Nginx version from attackers
    client_max_body_size 10M;               # Prevent payload DOS attacks
    client_body_buffer_size 128k;
    large_client_header_buffers 4 32k;

    # Rate limiting: 30 requests per second per IP (Anti-Brute Force / Anti-DDoS)
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Security Headers (OWASP recommendations)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # 2. PERFORMANCE OPTIMIZATIONS
    # -------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip compression for Angular JS/CSS assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream gRPC to Core API (Zero-Trust TLS on 8443)
    upstream api_grpc_service {
        server api:8443;
        keepalive 32;
    }

    # Upstream REST to Core API (Zero-Trust TLS on 8443)
    upstream api_rest_service {
        server api:8443;
        keepalive 32;
    }

    upstream bff_service {
        server bff:8080;
        keepalive 32;
    }

    # Upstream to Keycloak IAM
    upstream auth_service {
        server keycloak:8080;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # AUTH DOMAIN: auth.worldpinball.yourdomain.com / auth.localhost (Keycloak IAM)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        # listen 443 ssl; # Uncomment when SSL certificates are mounted
        server_name ~^auth\.;

        location / {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Keycloak uses large HTTP headers and cookies
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        # listen 443 ssl; # Uncomment when SSL certificates are mounted

        # -------------------------------------------------------------------------
        # DOMAIN CONFIGURATION:
        # Replace 'worldpinball.yourdomain.com' with your actual domain or VPS IP
        # -------------------------------------------------------------------------
        server_name worldpinball.yourdomain.com localhost;

        # Root directory for compiled Angular production files
        root /usr/share/nginx/html;
        index index.html;

        # Max 20 concurrent connections per IP
        limit_conn conn_limit 20;

        # 1. Angular SPA routing fallback (HTML5 history mode)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 2. Proxy API and Auth requests to .NET BFF with rate limiting
        location ~ ^/(api|bff|graphql|signin-oidc|signout-callback-oidc) {
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://bff_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # 3. SignalR WebSockets proxying for real-time Lobby and Telemetry
        location /hubs/ {
            proxy_pass http://bff_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 4. gRPC Game Session Service for arcade machines
        location /worldpinball.gamesessions.v1.GameSessionService/ {
            grpc_pass grpcs://api_grpc_service;
            grpc_ssl_server_name on;
            grpc_ssl_verify off;
            grpc_set_header Host $host;
            grpc_set_header X-Forwarded-Proto $scheme;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        # 5. Static assets caching (fonts, images, js, css)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }
}
