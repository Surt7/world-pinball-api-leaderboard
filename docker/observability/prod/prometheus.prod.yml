global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'keycloak'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['keycloak:9000']
