name: worldpinball-observability-dev

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: worldpinball-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics scraped by Prometheus
    depends_on:
      - tempo
      - loki
    networks:
      - default
      - app-net
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: worldpinball-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200" # Tempo HTTP
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: worldpinball-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - default
      - app-net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    container_name: worldpinball-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: worldpinball-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - prometheus
      - loki
    restart: unless-stopped

networks:
  default:
  app-net:
    name: worldpinball-dev_default
    external: true
