services:
  # Local development reverse proxy for fake domains topology (*.worldpinball.local)
  dev-nginx:
    image: nginx:1.27-alpine
    container_name: worldpinball-dev-nginx
    profiles: ["nginx", "apps"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/dev-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      default:
        aliases:
          - auth.worldpinball.local
          - api.worldpinball.local
          - bff.worldpinball.local
          - worldpinball.local
    restart: unless-stopped

  # Core API service (containerized)
  api:
    build:
      context: .
      dockerfile: WorldPinball.Api/Dockerfile
    image: worldpinball-api:dev
    profiles: ["apps"]
    deploy:
      replicas: 2
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ASPNETCORE_URLS: "https://+:8443"
      Kafka__BootstrapServers: "kafka:29092"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=worldpinball;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Keycloak__Authority: "https://auth.worldpinball.local/realms/worldpinball"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/worldpinball/.well-known/openid-configuration"
      Keycloak__Audience: "worldpinball-api"
      Redis__Host: "redis:6379"
      Redis__Password: "${REDIS_PASSWORD}"
      OtelCollector__OTEL_EXPORTER_OTLP_ENDPOINT: "http://worldpinball-otel-collector:4317"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://worldpinball-otel-collector:4317"
      OTEL_SERVICE_NAME: "WorldPinball.Api"
      Seq__ServerUrl: "http://seq:5341"
    volumes:
      - ./docker/nginx/certs/dev-rootCA.pem:/app/certs/dev-rootCA.pem:ro
      - ./docker/nginx/certs/worldpinball.local.crt:/app/certs/api.crt:ro
      - ./docker/nginx/certs/worldpinball.local.key:/app/certs/api.key:ro
      - ./docker/nginx/certs/leaderboard.key:/app/certs/leaderboard.key:ro
      - ./docker/nginx/certs/hub.crt:/app/certs/hub.crt:ro
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default:
        aliases:
          - core-api.worldpinball.local
        

  # BFF Gateway service (containerized)
  bff:
    build:
      context: .
      dockerfile: WorldPinball.Bff/Dockerfile
    image: worldpinball-bff:dev
    container_name: worldpinball-dev-bff
    profiles: ["apps"]
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      SSL_CERT_FILE: "/app/certs/dev-rootCA.pem"
      Services__CoreApi__Https: "https://core-api.worldpinball.local:8443"
      ReverseProxy__Clusters__core-api-cluster__Destinations__destination1__Address: "https://core-api.worldpinball.local:8443"
      ReverseProxy__Clusters__hub-cluster__Destinations__destination1__Address: "https://hub.worldpinball.local:8443"
      ReverseProxy__Routes__graphql-route__ClusterId: "core-api-cluster"
      ReverseProxy__Routes__graphql-route__Match__Path: "/graphql"
      Keycloak__Authority: "https://auth.worldpinball.local/realms/worldpinball"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/worldpinball/.well-known/openid-configuration"
      Keycloak__Audience: "worldpinball-bff"
      Keycloak__AdminUsername: "${KEYCLOAK_ADMIN:-admin}"
      Keycloak__AdminPassword: "${KEYCLOAK_ADMIN_PASSWORD}"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      OtelCollector__OTEL_EXPORTER_OTLP_ENDPOINT: "http://worldpinball-otel-collector:4317"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://worldpinball-otel-collector:4317"
      OTEL_SERVICE_NAME: "WorldPinball.Bff"
      Seq__ServerUrl: "http://seq:5341"
      Redis__Host: "redis:6379"
      Redis__Password: "${REDIS_PASSWORD}"
    volumes:
      - ./docker/nginx/certs/dev-rootCA.pem:/app/certs/dev-rootCA.pem:ro
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    
  # Dedicated PostgreSQL 17 with pgvector for Hub (Chat, Feed, Semantic Search)
  hub-db:
    image: pgvector/pgvector:pg17
    container_name: hub-postgres-vector
    environment:
      POSTGRES_DB: worldpinball_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}
    ports:
      - "5434:5432"
    volumes:
      - worldpinball_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d worldpinball_hub" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    
  # Real-time chat, community feed, and pgvector semantic search service
  hub:
    build:
      context: D:/Workspace/WorldPinball.GgWp.Hub
      dockerfile: WorldPinball.GgWp.Hub.Api/Dockerfile
    image: worldpinball-hub:dev
    container_name: worldpinball-dev-hub
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      hub-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      default:
        aliases:
          - hub.worldpinball.local
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "https://+:8443"
      SSL_CERT_FILE: "/app/certs/dev-rootCA.pem"
      ConnectionStrings__DefaultConnection: "Host=hub-postgres-vector;Port=5432;Database=worldpinball_hub;Username=postgres;Password=${HUB_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}"
      Redis__Host: "redis:6379"
      Redis__Password: "${REDIS_PASSWORD}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "${RABBITMQ_DEFAULT_USER:-worldpinball}"
      RabbitMq__Password: "${RABBITMQ_DEFAULT_PASS}"
      Gemini__ApiKey: "${GEMINI_API_KEY}"
      Keycloak__Authority: "https://auth.worldpinball.local/realms/worldpinball"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/worldpinball/.well-known/openid-configuration"
      Keycloak__Audience: "worldpinball-api"
    volumes:
      - ./docker/nginx/certs/dev-rootCA.pem:/app/certs/dev-rootCA.pem:ro
      - ./docker/nginx/certs/hub.crt:/app/certs/hub.crt:ro
      - ./docker/nginx/certs/hub.key:/app/certs/hub.key:ro
      - ./docker/nginx/certs/leaderboard.crt:/app/certs/leaderboard.crt:ro
       
       
  # Allow Keycloak to accept requests from auth.worldpinball.local
  keycloak:
    environment:
      KC_HOSTNAME: "https://auth.worldpinball.local"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"

  # Angular Frontend SPA
  frontend:
    image: worldpinball-frontend:latest
    container_name: worldpinball-frontend
    restart: unless-stopped

volumes:
  worldpinball_hub_pgdata: