services:
  # 0. Nginx Gateway & Angular SPA Host (Public entry point)
  nginx:
    image: nginx:1.27-alpine
    container_name: worldpinball-prod-nginx
    ports:
      - "80:80"
      # - "443:443" # Uncomment when SSL certificates (Let's Encrypt / Certbot) are mounted
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./frontend/dist/browser:/usr/share/nginx/html:ro # Mounted compiled Angular files
    depends_on:
      - bff
    restart: unless-stopped
    networks:
      - worldpinball-network

  # 1. Reverse Proxy BFF (Internal Gateway)
  bff:
    build:
      context: .
      dockerfile: WorldPinball.Bff/Dockerfile
    container_name: worldpinball-prod-bff
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - Services__CoreApi__Https=https://api:8443
      - ReverseProxy__Clusters__core-api-cluster__Destinations__destination1__Address=https://api:8443
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      - Keycloak__Authority=https://auth.${DOMAIN:-localhost}/realms/worldpinball
      - Keycloak__ClientId=worldpinball-bff
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - SSL_CERT_FILE=/app/certs/rootCA.pem
    volumes:
      - ./docker/nginx/certs/dev-rootCA.pem:/app/certs/rootCA.pem:ro
    depends_on:
      - api
      - redis
    restart: unless-stopped
    networks:
      - worldpinball-network

  # 2. Core Backend API
  api:
    build:
      context: .
      dockerfile: WorldPinball.Api/Dockerfile
    deploy:
      replicas: 2
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ASPNETCORE_URLS=https://+:8443
      - DOTNET_RUN_MIGRATIONS=true
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=worldpinball;Username=postgres;Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      - Keycloak__Authority=https://auth.${DOMAIN:-localhost}/realms/worldpinball
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/worldpinball/.well-known/openid-configuration
      - Keycloak__Audience=worldpinball-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=WorldPinball.Api
      - KeyVault__VaultUri=
      - Kafka__BootstrapServers=kafka:29092
    volumes:
      - ./docker/nginx/certs/worldpinball.local.crt:/app/certs/api.crt:ro
      - ./docker/nginx/certs/worldpinball.local.key:/app/certs/api.key:ro
      - ./docker/nginx/certs/dev-rootCA.pem:/app/certs/rootCA.pem:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - worldpinball-network

  # 3. PostgreSQL Database
  db:
    image: postgres:16.15-alpine
    container_name: worldpinball-prod-db
    environment:
      POSTGRES_DB: worldpinball
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - worldpinball_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worldpinball"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - worldpinball-network

  # 4. Redis Cache
  redis:
    image: redis:8.10.1-alpine
    container_name: worldpinball-prod-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - worldpinball_prod_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - worldpinball-network

  # 4b. Apache Kafka Message Broker
  kafka:
    image: apache/kafka:4.3.1
    container_name: worldpinball-prod-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - worldpinball_prod_kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - worldpinball-network

  # 5. OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: worldpinball-prod-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/observability/prod/otel-collector.prod.yml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    networks:
      - worldpinball-network

  # 6. Keycloak Database
  keycloak-db:
    image: postgres:16.15-alpine
    container_name: worldpinball-prod-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
    volumes:
      - worldpinball_prod_keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - worldpinball-network

  # 7. Keycloak Production IAM
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: worldpinball-prod-keycloak
    command: start --optimized --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
      KC_HOSTNAME: https://auth.${DOMAIN:-localhost}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./docker/keycloak/worldpinball-realm.prod.json:/opt/keycloak/data/import/worldpinball-realm.prod.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks:
      - worldpinball-network

volumes:
  worldpinball_prod_pgdata:
  worldpinball_prod_redisdata:
  worldpinball_prod_keycloak_pgdata:
  worldpinball_prod_kafkadata:

networks:
  worldpinball-network:
    driver: bridge